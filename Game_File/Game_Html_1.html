<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 NEON BREAKER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  #wrapper {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a0520 0%, #000 100%);
  }
  canvas {
    display: block;
    background: #000;
    border-radius: 12px;
    box-shadow: 0 0 80px rgba(255, 0, 200, 0.4), inset 0 0 40px rgba(0, 255, 255, 0.1);
    touch-action: none;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 15px; left: 15px; right: 15px;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
    font-size: clamp(12px, 2.5vw, 18px);
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 0, 200, 0.8);
  }
  #hud .item { display: flex; flex-direction: column; gap: 2px; }
  #hud .label { color: #ff00c8; font-size: 0.75em; letter-spacing: 1px; }
  #hud .value { font-weight: bold; font-size: 1.2em; color: #00ffff; text-shadow: 0 0 15px #00ffff; }
  #scoreVal { color: #ffd700; text-shadow: 0 0 15px #ffd700; }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 20px;
    background: rgba(10, 5, 32, 0.97);
    z-index: 100; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: clamp(28px, 7vw, 52px);
    color: #fff;
    text-shadow: 0 0 30px #ff00c8, 0 0 60px #ff00c8;
    letter-spacing: 4px;
    animation: pulse 1.5s infinite;
  }
  .overlay h2 {
    font-size: clamp(22px, 5vw, 36px);
    color: #ffd700;
    text-shadow: 0 0 20px #ffd700;
  }
  .overlay p { color: #8888ff; font-size: clamp(12px, 2.5vw, 15px); line-height: 1.8; max-width: 420px; }
  .overlay .finalScore {
    font-size: clamp(36px, 9vw, 64px);
    color: #ffd700;
    font-weight: bold;
    text-shadow: 0 0 30px #ffd700;
  }
  .btn {
    padding: 14px 40px;
    font-size: clamp(14px, 3vw, 18px);
    font-family: inherit; font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #ff00c8 0%, #8b00cc 100%);
    border: 2px solid #ff00c8;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 2px;
    box-shadow: 0 0 25px rgba(255, 0, 200, 0.6);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(255, 0, 200, 0.9); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary {
    background: linear-gradient(180deg, #333 0%, #111 100%);
    border-color: #666;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Mobile */
  #mobileHint {
    position: absolute;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #6666aa; font-size: 11px; text-align: center;
    pointer-events: none; z-index: 10;
  }

  /* Powerup text */
  .popup {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ffd700;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: bold;
    text-shadow: 0 0 25px #ffd700, 0 0 50px #ffd700;
    pointer-events: none;
    z-index: 50;
    animation: popupAnim 1s ease-out forwards;
  }
  @keyframes popupAnim {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    60% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="item">
      <span class="label">SCORE</span>
      <span class="value" id="scoreVal">0</span>
    </div>
    <div class="item" style="text-align:left;">
      <span class="label">LEVEL</span>
      <span class="value" id="levelVal">1</span>
    </div>
    <div class="item" style="text-align:left;">
      <span class="label">LIVES</span>
      <span class="value" id="livesVal" style="color:#ff0066; text-shadow:0 0 15px #ff0066;">♥♥♥</span>
    </div>
  </div>

  <div class="overlay show" id="startScreen">
    <h1>NEON BREAKER</h1>
    <p>
      توپ نئونی رو کنترل کن<br>
      همه بلوک‌ها رو بشکن<br>
      Power-Up ها رو جمع کن
    </p>
    <button class="btn" id="startBtn">▶ START</button>
    <p style="font-size:11px;">← → حرکت &nbsp;|&nbsp; SPACE شلیک &nbsp;|&nbsp; P مکث</p>
  </div>

  <div class="overlay" id="pauseScreen">
    <h2>⏸ PAUSED</h2>
    <button class="btn" id="resumeBtn">▶ RESUME</button>
    <button class="btn secondary" id="quitBtn">🏠 MENU</button>
  </div>

  <div class="overlay" id="gameOverScreen">
    <h2>💀 GAME OVER</h2>
    <p>امتیاز نهایی:</p>
    <div class="finalScore" id="finalScore">0</div>
    <p id="highScoreMsg" style="color:#ffd700;"></p>
    <button class="btn" id="restartBtn">🔄 RETRY</button>
    <button class="btn secondary" id="menuBtn">🏠 MENU</button>
  </div>

  <div class="overlay" id="winScreen">
    <h2 style="color:#00ff88; text-shadow:0 0 20px #00ff88;">🎉 YOU WIN!</h2>
    <p>همه بلوک‌ها رو شکستی!</p>
    <div class="finalScore" id="winScore" style="color:#00ff88; text-shadow:0 0 30px #00ff88;">0</div>
    <button class="btn" id="nextLevelBtn">▶ NEXT LEVEL</button>
    <button class="btn secondary" id="winMenuBtn">🏠 MENU</button>
  </div>

  <div id="mobileHint">👆 انگشتت رو روی صفحه بکش</div>
</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // SETUP
  // ============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('wrapper');
  const scoreVal = document.getElementById('scoreVal');
  const levelVal = document.getElementById('levelVal');
  const livesVal = document.getElementById('livesVal');

  const startScreen = document.getElementById('startScreen');
  const pauseScreen = document.getElementById('pauseScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const winScreen = document.getElementById('winScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const winScoreEl = document.getElementById('winScore');
  const highScoreMsg = document.getElementById('highScoreMsg');

  let W = 800, H = 600;
  function resize() {
    const maxW = Math.min(window.innerWidth - 20, 900);
    const maxH = Math.min(window.innerHeight - 20, 700);
    const ratio = maxW / maxH;
    if (ratio > 4/3) { H = maxH; W = H * 4/3; }
    else { W = maxW; H = W * 3/4; }
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // ============================================================
  // AUDIO
  // ============================================================
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  // ============================================================
  // STATE
  // ============================================================
  let state = 'menu';
  let score = 0, level = 1, lives = 3;
  let highScore = parseInt(localStorage.getItem('neonBreakerHigh') || '0');

  let paddle, ball, bricks, particles, powerups, bullets, stars;
  let keys = {};
  let lastTime = 0;
  let shakeTime = 0, shakeAmount = 0;
  let gameTime = 0;
  let comboCount = 0, comboTimer = 0;
  let paddleMoving = 0;

  const COLORS = {
    pink: '#ff00c8',
    cyan: '#00ffff',
    yellow: '#ffd700',
    green: '#00ff88',
    purple: '#a855f7',
    orange: '#ff8800',
    red: '#ff0044'
  };
  const COLOR_LIST = [COLORS.pink, COLORS.cyan, COLORS.yellow, COLORS.green, COLORS.purple, COLORS.orange];

  // ============================================================
  // STARS BACKGROUND
  // ============================================================
  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.3,
        speed: Math.random() * 30 + 8,
        alpha: Math.random() * 0.6 + 0.2,
        color: Math.random() < 0.3 ? COLORS.cyan : (Math.random() < 0.5 ? COLORS.pink : '#fff')
      });
    }
  }

  // ============================================================
  // CREATE GAME OBJECTS
  // ============================================================
  function createPaddle() {
    return {
      x: W / 2,
      y: H - 40,
      w: Math.max(80, W * 0.15),
      h: 14,
      speed: 550,
      color: COLORS.cyan
    };
  }

  function createBall() {
    return {
      x: W / 2,
      y: H - 70,
      vx: (Math.random() < 0.5 ? -1 : 1) * 250,
      vy: -300,
      r: 8,
      speed: 350,
      color: COLORS.pink,
      trail: []
    };
  }

  function createBricks() {
    bricks = [];
    const cols = 9;
    const rows = Math.min(4 + level, 7);
    const padding = 8;
    const offsetTop = 80;
    const offsetLeft = 30;
    const brickW = (W - offsetLeft * 2 - padding * (cols - 1)) / cols;
    const brickH = 22;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        // Skip some bricks for pattern
        if (level > 2 && (row + col) % 7 === 0) continue;
        
        const color = COLOR_LIST[row % COLOR_LIST.length];
        bricks.push({
          x: offsetLeft + col * (brickW + padding),
          y: offsetTop + row * (brickH + padding),
          w: brickW,
          h: brickH,
          color: color,
          hp: 1 + Math.floor(row / 3),
          maxHp: 1 + Math.floor(row / 3),
          hitFlash: 0,
          points: (rows - row) * 10
        });
      }
    }
  }

  // ============================================================
  // PARTICLES
  // ============================================================
  function spawnParticles(x, y, color, count, speed, size) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * (speed || 250) + 50;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1,
        maxLife: 0.5 + Math.random() * 0.5,
        color: color,
        size: Math.random() * (size || 4) + 1,
        gravity: 200
      });
    }
  }

  // ============================================================
  // POWERUPS
  // ============================================================
  const POWERUP_TYPES = {
    wide: { color: COLORS.green, icon: '⬌', label: 'WIDE PADDLE' },
    multi: { color: COLORS.yellow, icon: '●●●', label: 'MULTI BALL' },
    slow: { color: COLORS.cyan, icon: '🐢', label: 'SLOW BALL' },
    life: { color: COLORS.red, icon: '♥', label: '+1 LIFE' },
    laser: { color: COLORS.purple, icon: '🔫', label: 'LASER' }
  };

  function spawnPowerup(x, y) {
    const types = Object.keys(POWERUP_TYPES);
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
      x: x, y: y,
      w: 24, h: 24,
      type: type,
      speed: 120,
      rotation: 0,
      bob: 0
    });
  }

  // ============================================================
  // GAME INIT
  // ============================================================
  function initGame() {
    paddle = createPaddle();
    ball = createBall();
    createBricks();
    particles = [];
    powerups = [];
    bullets = [];
    score = 0;
    lives = 3;
    gameTime = 0;
    shakeTime = 0;
    comboCount = 0;
    comboTimer = 0;
    paddleMoving = 0;
    initStars();
    updateHUD();
  }

  function updateHUD() {
    scoreVal.textContent = score;
    levelVal.textContent = level;
    livesVal.textContent = '♥'.repeat(Math.max(0, lives));
  }

  // ============================================================
  // INPUT
  // ============================================================
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k) || e.key === ' ') {
      e.preventDefault();
    }
    if ((k === 'p' || e.key === 'Escape')) {
      if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
    }
  }, {passive: false});

  document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // Mouse / touch paddle
  function movePaddle(clientX) {
    if (state !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, x));
  }

  canvas.addEventListener('mousemove', (e) => {
    if (state === 'playing') movePaddle(e.clientX);
  });

  canvas.addEventListener('touchmove', (e) => {
    if (state === 'playing') {
      e.preventDefault();
      movePaddle(e.touches[0].clientX);
    }
  }, {passive: false});

  canvas.addEventListener('touchstart', (e) => {
    initAudio();
    if (state === 'playing') {
      e.preventDefault();
      movePaddle(e.touches[0].clientX);
    }
  }, {passive: false});

  // ============================================================
  // UPDATE
  // ============================================================
  function update(dt) {
    if (state !== 'playing') return;
    gameTime += dt;

    if (shakeTime > 0) shakeTime -= dt;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) comboCount = 0; }

    // Stars
    for (const s of stars) {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Paddle movement
    let dx = 0;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    paddle.x += dx * paddle.speed * dt;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
    paddleMoving = dx;

    // Lasers
    if (keys[' '] && paddle.laser && gameTime - (paddle.lastShot || 0) > 0.2) {
      paddle.lastShot = gameTime;
      bullets.push({ x: paddle.x - 15, y: paddle.y - 10, vy: -800, color: COLORS.purple });
      bullets.push({ x: paddle.x + 15, y: paddle.y - 10, vy: -800, color: COLORS.purple });
      beep(1200, 0.05, 'square', 0.05);
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy * dt;
      if (b.y < -20) { bullets.splice(i, 1); continue; }
      
      // Check brick collision
      for (let j = bricks.length - 1; j >= 0; j--) {
        const br = bricks[j];
        if (b.x > br.x && b.x < br.x + br.w && b.y > br.y && b.y < br.y + br.h) {
          hitBrick(j, br);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    // Ball
    const ballSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    
    // Ball trail
    ball.trail.push({ x: ball.x, y: ball.y, life: 0.3 });
    for (let i = ball.trail.length - 1; i >= 0; i--) {
      ball.trail[i].life -= dt;
      if (ball.trail[i].life <= 0) ball.trail.splice(i, 1);
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(600, 0.03, 'square', 0.04); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(600, 0.03, 'square', 0.04); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); beep(600, 0.03, 'square', 0.04); }

    // Bottom - lose life
    if (ball.y - ball.r > H) {
      lives--;
      updateHUD();
      shakeTime = 0.4;
      shakeAmount = 15;
      spawnParticles(ball.x, H - 10, COLORS.red, 30, 300);
      beep(100, 0.5, 'sawtooth', 0.15);
      
      if (lives <= 0) {
        gameOver();
        return;
      }
      // Reset ball
      ball = createBall();
      paddle.x = W / 2;
    }

    // Paddle collision
    if (ball.vy > 0 && ball.y + ball.r > paddle.y - paddle.h / 2 && ball.y - ball.r < paddle.y + paddle.h / 2) {
      if (ball.x > paddle.x - paddle.w / 2 && ball.x < paddle.x + paddle.w / 2) {
        // Hit paddle
        ball.y = paddle.y - paddle.h / 2 - ball.r;
        const hitPos = (ball.x - paddle.x) / (paddle.w / 2);
        const angle = hitPos * Math.PI / 3; // Max 60 degrees
        const speed = Math.min(ballSpeed * 1.02, 700);
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.cos(angle) * speed;
        beep(800, 0.05, 'square', 0.06);
        spawnParticles(ball.x, ball.y, COLORS.cyan, 5, 150, 3);
      }
    }

    // Brick collisions
    for (let i = bricks.length - 1; i >= 0; i--) {
      const br = bricks[i];
      if (br.hitFlash > 0) br.hitFlash -= dt;
      
      // Check collision with ball
      const closestX = Math.max(br.x, Math.min(ball.x, br.x + br.w));
      const closestY = Math.max(br.y, Math.min(ball.y, br.y + br.h));
      const distX = ball.x - closestX;
      const distY = ball.y - closestY;
      const distSq = distX * distX + distY * distY;

      if (distSq < ball.r * ball.r) {
        // Determine collision side
        const overlapX = ball.r - Math.abs(distX);
        const overlapY = ball.r - Math.abs(distY);
        
        if (overlapX < overlapY) {
          ball.vx = -ball.vx;
          ball.x += distX > 0 ? overlapX : -overlapX;
        } else {
          ball.vy = -ball.vy;
          ball.y += distY > 0 ? overlapY : -overlapY;
        }

        hitBrick(i, br);
        break;
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= 0.98;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.speed * dt;
      p.rotation += dt * 3;
      p.bob += dt * 5;
      if (p.y > H + 30) { powerups.splice(i, 1); continue; }
      
      // Check paddle collision
      if (p.y + p.h / 2 > paddle.y - paddle.h / 2 &&
          p.y - p.h / 2 < paddle.y + paddle.h / 2 &&
          p.x + p.w / 2 > paddle.x - paddle.w / 2 &&
          p.x - p.w / 2 < paddle.x + paddle.w / 2) {
        applyPowerup(p.type);
        spawnParticles(p.x, p.y, POWERUP_TYPES[p.type].color, 15, 200);
        beep(1047, 0.15, 'square', 0.1);
        powerups.splice(i, 1);
      }
    }

    // Check win
    if (bricks.length === 0) {
      winLevel();
    }
  }

  function hitBrick(index, brick) {
    brick.hp--;
    brick.hitFlash = 0.1;
    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 8, 200, 3);
    beep(400 + Math.random() * 300, 0.04, 'square', 0.05);
    shakeTime = 0.05;
    shakeAmount = 3;

    if (brick.hp <= 0) {
      comboCount++;
      comboTimer = 1.5;
      const mult = comboCount >= 5 ? 3 : (comboCount >= 3 ? 2 : 1);
      score += brick.points * mult;
      updateHUD();
      
      spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 20, 350, 4);
      beep(150 + Math.random() * 100, 0.15, 'sawtooth', 0.08);
      shakeTime = 0.15;
      shakeAmount = 6;
      
      // Powerup drop
      if (Math.random() < 0.12) {
        spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
      }
      
      bricks.splice(index, 1);
    }
  }

  function applyPowerup(type) {
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.textContent = POWERUP_TYPES[type].label;
    wrapper.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);

    if (type === 'wide') {
      paddle.w = Math.min(paddle.w * 1.5, W * 0.3);
      setTimeout(() => { if (paddle) paddle.w = Math.max(80, W * 0.15); }, 8000);
    } else if (type === 'multi') {
      // Add 2 more balls
      const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      for (let i = 0; i < 2; i++) {
        const angle = (Math.random() - 0.5) * Math.PI / 2;
        const newBall = createBall();
        newBall.x = ball.x;
        newBall.y = ball.y;
        newBall.vx = Math.sin(angle) * speed;
        newBall.vy = -Math.cos(angle) * speed;
        // Simplified: use same ball array if we wanted multi, but for simplicity we'll enhance existing
      }
      // For simplicity: give the ball extra speed instead
      ball.vx *= 1.2;
      ball.vy *= 1.2;
    } else if (type === 'slow') {
      const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (speed > 200) {
        ball.vx *= 0.7;
        ball.vy *= 0.7;
      }
    } else if (type === 'life') {
      if (lives < 5) { lives++; updateHUD(); }
    } else if (type === 'laser') {
      paddle.laser = true;
      setTimeout(() => { if (paddle) paddle.laser = false; }, 10000);
    }
  }

  // ============================================================
  // DRAW
  // ============================================================
  function draw() {
    // Background
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Shake
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
      sx = (Math.random() - 0.5) * shakeAmount;
      sy = (Math.random() - 0.5) * shakeAmount;
    }
    ctx.save();
    ctx.translate(sx, sy);

    // Stars
    for (const s of stars) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.alpha;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    if (state === 'menu') {
      ctx.restore();
      return;
    }

    // Bricks
    for (const br of bricks) {
      ctx.save();
      
      const isFlashing = br.hitFlash > 0;
      const hpRatio = br.hp / br.maxHp;
      
      // Glow
      ctx.shadowColor = br.color;
      ctx.shadowBlur = isFlashing ? 25 : 12;
      
      // Main brick
      ctx.fillStyle = isFlashing ? '#fff' : br.color;
      ctx.fillRect(br.x, br.y, br.w, br.h);
      
      // Inner shine
      if (!isFlashing) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(br.x + 2, br.y + 2, br.w - 4, 3);
      }
      
      ctx.shadowBlur = 0;
      
      // HP indicator (darken)
      if (br.maxHp > 1 && br.hp < br.maxHp) {
        ctx.fillStyle = `rgba(0, 0, 0, ${1 - hpRatio})`;
        ctx.fillRect(br.x, br.y, br.w, br.h);
      }
      
      ctx.restore();
    }

    // Powerups
    for (const p of powerups) {
      const cfg = POWERUP_TYPES[p.type];
      ctx.save();
      ctx.translate(p.x, p.y + Math.sin(p.bob) * 3);
      
      // Glow
      ctx.shadowColor = cfg.color;
      ctx.shadowBlur = 20;
      
      // Box
      ctx.fillStyle = cfg.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      
      // Border
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
      
      ctx.shadowBlur = 0;
      
      // Icon
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cfg.icon, 0, 0);
      
      ctx.restore();
    }

    // Bullets
    for (const b of bullets) {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 15;
      ctx.fillRect(b.x - 2, b.y - 10, 4, 14);
      ctx.shadowBlur = 0;
    }

    // Ball trail
    for (const t of ball.trail) {
      ctx.globalAlpha = t.life / 0.3 * 0.5;
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * (t.life / 0.3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ball
    ctx.shadowColor = ball.color;
    ctx.shadowBlur = 25;
    ctx.fillStyle = ball.color;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    
    // Ball inner
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Paddle
    ctx.shadowColor = paddle.color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = paddle.color;
    
    // Rounded paddle
    const pr = paddle.h / 2;
    ctx.beginPath();
    ctx.roundRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h, pr);
    ctx.fill();
    
    // Paddle inner shine
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.roundRect(paddle.x - paddle.w/2 + 3, paddle.y - paddle.h/2 + 2, paddle.w - 6, 3, 1.5);
    ctx.fill();
    
    ctx.shadowBlur = 0;

    // Particles
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Combo
    if (comboCount >= 3 && comboTimer > 0) {
      ctx.fillStyle = COLORS.yellow;
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.shadowColor = COLORS.yellow;
      ctx.shadowBlur = 20;
      const mult = comboCount >= 5 ? 3 : 2;
      ctx.fillText(`COMBO x${mult}!`, W/2, 60);
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // ============================================================
  // GAME LOOP
  // ============================================================
  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.05) dt = 0.05; // Cap

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ============================================================
  // GAME CONTROL
  // ============================================================
  function startGame() {
    initAudio();
    initGame();
    state = 'playing';
    startScreen.classList.remove('show');
    gameOverScreen.classList.remove('show');
    winScreen.classList.remove('show');
    pauseScreen.classList.remove('show');
    lastTime = 0;
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    pauseScreen.classList.add('show');
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    pauseScreen.classList.remove('show');
    lastTime = 0;
  }

  function gameOver() {
    state = 'gameover';
    finalScoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('neonBreakerHigh', highScore);
      highScoreMsg.textContent = '🏆 NEW HIGH SCORE!';
    } else {
      highScoreMsg.textContent = `🏆 Best: ${highScore}`;
    }
    gameOverScreen.classList.add('show');
    beep(100, 0.6, 'sawtooth', 0.2);
  }

  function winLevel() {
    state = 'win';
    winScoreEl.textContent = score;
    winScreen.classList.add('show');
    // Victory sound
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => setTimeout(() => beep(n, 0.15, 'square', 0.1), i * 100));
  }

  function goToMenu() {
    state = 'menu';
    pauseScreen.classList.remove('show');
    gameOverScreen.classList.remove('show');
    winScreen.classList.remove('show');
    startScreen.classList.add('show');
  }

  // ============================================================
  // BUTTONS
  // ============================================================
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('quitBtn').addEventListener('click', goToMenu);
  document.getElementById('menuBtn').addEventListener('click', goToMenu);
  document.getElementById('winMenuBtn').addEventListener('click', goToMenu);
  document.getElementById('nextLevelBtn').addEventListener('click', () => {
    level++;
    startGame();
  });

  // ============================================================
  // POLYFILL roundRect
  // ============================================================
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.beginPath();
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ============================================================
  // INIT
  // ============================================================
  initGame();
  requestAnimationFrame(loop);
})();
</script>
